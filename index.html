<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Cluevoyance" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <script>
      // Appearance before the first paint (the same choice as src/theme.js), so
      // a saved Dark never flashes light while the app loads.
      (function () {
        var c = "system";
        try { c = localStorage.getItem("cv-theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.setAttribute("data-theme", dark ? "dark" : "light");
        r.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html, body { background: #faf7fa; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1b1224; }
    </style>
    <!-- preview -->
    <title>Cluevoyance</title>
    <meta name="description" content="A daily word puzzle you solve by reading the clues. Make puzzles for your friends, too." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cluevoyance" />
    <meta property="og:title" content="Cluevoyance" />
    <meta property="og:description" content="A daily word puzzle you solve by reading the clues. Make puzzles for your friends, too." />
    <meta property="og:image" content="https://cluevoyance.com/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /preview -->
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
